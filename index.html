<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1><span class="q">Q</span><span class="u">u</span><span class="i">i</span><span class="c">c</span><span class="k">k</span><span class="n">N</span><span class="o">o</span><span class="t">t</span><span class="e">e</span><span class="s">S</span><span class="app"> App</span></h1>
      <p>Capture ideas before they disappear</p>
    </header>
    <main>
      <section>
        <h2>Add a Note</h2>

        <form id="note-form">
          <label for="note-input">Enter Your Note </label>
          <input
            type="text"
            id="note-input"
            maxlength="200"
            placeholder="Write Your Note"
            required
          />

          <label for="note-category">Choose Cartegory</label>
          <select id="note-category" name="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
          <button id="categoryBtn" type="submit">Add Note</button>
        </form>
        <p id="error-message" role="alert"></p>
      </section>

      <section>
        <h2>Your Notes</h2>
        <label for="search-input">Search for a note</label>
        <input id="search-input" type="search" placeholder="Search notes" />
        <ul id="notes-list"></ul>
        <p id="note-count">You have 0 notes</p>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 QuickNotes buiit during web foundations project</p>
    </footer>
  </body>
</html>
